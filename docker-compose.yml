services:
  redis-stickers:
    image: redis:latest
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - ${REDIS_PORT}:${REDIS_INTERNAL_PORT}
    volumes:
      - redis_data_stickers:/data
    networks:
      - backend-stickers
    command: redis-server --bind 0.0.0.0 --protected-mode no

  postgres-stickers:
    image: postgres:17.2
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - ${DB_PORT}:${DB_INTERNAL_PORT}
    networks:
      - backend-stickers
    volumes:
      - db_data_stickers:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  backend-stickers:
  chickchirick-shared-network:
    external: true

volumes:
  db_data_stickers:
  redis_data_stickers: