services:
  nginx-stickers:
    build:
      context: .
      dockerfile: ./build/dev/nginx/Dockerfile
    ports:
      - '87:80'
    depends_on:
      - api-stickers
    volumes:
      - ./build/dev/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      backend-stickers:
      chickchirick-shared-network:
        aliases:
          - api-stickers-nginx

  api-stickers:
    build:
      context: .
      dockerfile: ./build/dev/Dockerfile
    ports:
      - "8087:8080"
      - "40005:40000"
      - "6063:6060"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - "seccomp=unconfined"
    depends_on:
      postgres-stickers:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AUTH_APP: ${AUTH_APP:-http://host.docker.internal:8082}
      USER_APP: ${USER_APP:-http://host.docker.internal:8081}
      FRONTEND_APP: ${FRONTEND_APP:-http://localhost:5173}
    volumes:
      - .:/app
    networks:
      - backend-stickers
      - chickchirick-shared-network

networks:
  backend-stickers:
  chickchirick-shared-network:
    external: true
